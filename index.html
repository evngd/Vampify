<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streamline</title>
<style>
:root{--bg:#000;--panel:#121212;--card:#181818;--hover:#2a2a2a;--text:#fff;--mute:#b3b3b3;--green:#1ed760;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr 76px;gap:8px;height:100%;padding:8px}
.side,.main{background:var(--panel);border-radius:10px;overflow:auto}
.side{padding:16px 8px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:20px;padding:0 12px 12px;letter-spacing:-.5px}
.logo i{color:var(--green);font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;color:var(--mute);width:100%;text-align:left;font-weight:600}
.nav:hover,.nav.on{color:var(--text);background:var(--hover)}
.sep{height:1px;background:#2a2a2a;margin:8px 12px}
.pfp{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.modsw{margin-top:auto;padding:12px;display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
.modsw input{accent-color:var(--green)}
.banner{height:260px;padding:24px;display:flex;align-items:flex-end;gap:20px}
.banner .pfp{width:140px;height:140px;font-size:56px;box-shadow:0 4px 40px #0008}
.banner h1{font-size:64px;margin:0;line-height:1;letter-spacing:-2px}
.banner p{margin:8px 0 0;font-weight:500}
.bar{display:flex;gap:16px;align-items:center;padding:20px 24px}
.big{width:56px;height:56px;border-radius:50%;background:var(--green);color:#000;font-size:22px}
.big:hover{transform:scale(1.05)}
.pill{border:1px solid #727272;border-radius:20px;padding:6px 16px;font-weight:700}
.pill:hover{border-color:#fff}
h2{font-size:22px;margin:0 24px 8px}
.row{display:grid;grid-template-columns:32px 1fr 36px 140px 40px;gap:8px;align-items:center;padding:8px 24px;margin:0 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--hover)}
.row.cur .t{color:var(--green)}
.row .n{color:var(--mute);text-align:center}
.row .st{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.more{color:var(--mute);font-size:18px}.more:hover{color:#fff}
.empty{padding:24px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;padding:0 24px 24px}
.card{background:var(--card);border-radius:8px;padding:16px;text-align:left}
.card:hover{background:var(--hover)}
.card .pfp{width:100%;height:auto;aspect-ratio:1;border-radius:50%;font-size:48px;margin-bottom:12px}
.card b{display:block}.card span{color:var(--mute);font-size:13px}
.player{grid-column:1/-1;background:var(--bg);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 12px;gap:12px}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np div{min-width:0}
.np .pfp{border-radius:4px;width:52px;height:52px}
.np small{color:var(--mute);display:block}
.cov{width:40px;height:40px;border-radius:4px;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:700;color:#fff}
.row .t{display:flex;align-items:center;gap:12px;min-width:0}
.row .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;color:var(--mute)}
.pick:hover{color:#fff}
.vf{display:inline-grid;place-items:center;width:16px;height:16px;font-size:11px;border-radius:50%;background:#3d91f4;color:#fff;font-style:normal;font-weight:800;margin-left:6px;vertical-align:middle;line-height:1;flex:none}
.banner h1 .vf{width:34px;height:34px;font-size:20px;margin-left:12px}
.bar{flex-wrap:wrap}
label.pill{cursor:pointer}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.pp{width:34px;height:34px;border-radius:50%;background:#fff;color:#000}
.pr{display:flex;gap:8px;align-items:center;width:100%;color:var(--mute);font-size:12px}
.track{flex:1;height:4px;background:#4d4d4d;border-radius:2px;overflow:hidden}
.track div{height:100%;width:0;background:#fff}
.track{cursor:pointer;height:6px}
.sb{position:sticky;top:0;z-index:5;padding:12px 24px;background:#121212cc;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#q{width:min(100%,380px);padding:10px 16px;border-radius:20px;border:0;background:#2a2a2a;color:#fff;font:inherit}
#q:focus{outline:2px solid #fff}
.ebv{height:90px;border-radius:6px;margin-bottom:12px}
.dlg{max-height:90vh;overflow:auto}
.dlg textarea{width:100%;padding:12px;border-radius:4px;border:0;background:#3e3e3e;color:#fff;font:inherit;margin-bottom:16px;resize:vertical}
.ths{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.th{position:relative;width:56px;height:56px;border-radius:6px;flex:none}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#000;font-size:14px;line-height:1}
.about{display:flex;gap:24px;padding:0 24px 40px;align-items:flex-start;flex-wrap:wrap}
.sld{position:relative;width:min(100%,420px);height:260px;border-radius:10px;overflow:hidden;flex:none}
.sl{position:absolute;inset:0}
.sn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#000a;font-size:22px;line-height:1}
.sn:hover{background:#000}
.sn.p{left:10px}.sn.n{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff6}
.dots i.on{background:#fff}
.bio{flex:1;min-width:240px;max-width:60ch;margin:0;font-size:16px;line-height:1.6;color:var(--mute);white-space:pre-wrap}
.hrt{color:var(--mute);font-size:18px;width:32px;flex:none}.hrt:hover{color:#fff}.hrt.on{color:var(--green)}
.side{overflow:hidden}
.libs{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.lh{padding:6px 12px;font-weight:700;color:var(--mute)}
.lb{padding:6px 12px}
.lb .lt{display:flex;flex-direction:column;min-width:0;text-align:left}
.lb .lt b{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb small{color:var(--mute);font-weight:400}
.ic{width:32px;height:32px;border-radius:4px;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.sq{position:relative;padding:4px}
.sq svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
#q{width:100%;padding:9px 14px 9px 38px}
@media(max-width:760px){.side{overflow:auto}.libs{flex:none;overflow:visible;flex-direction:row}.lh,.lb small{display:none}.sq{min-width:160px}}
.flash{animation:fl .7s}
@keyframes fl{0%{color:var(--green);transform:scale(1.08)}100%{transform:none}}
#cm{position:fixed;z-index:20;background:#282828;border-radius:6px;padding:4px;min-width:190px;box-shadow:0 8px 24px #000a;display:none}
#cm button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:4px}
#cm button:hover{background:#3e3e3e}
#cm .bst{color:var(--green);font-weight:700}
#ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:30}
.dlg{background:#282828;border-radius:10px;padding:24px;width:min(92vw,400px)}
.dlg h3{margin:0 0 4px;font-size:20px}.dlg p{margin:0 0 16px;color:var(--mute)}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dlg input[type=text]{width:100%;padding:12px;border-radius:4px;border:0;background:#3e3e3e;color:#fff;font:inherit;margin-bottom:16px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.go{background:var(--green);color:#000;font-weight:700;border-radius:20px;padding:10px 24px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--green);color:#000;font-weight:700;padding:10px 18px;border-radius:20px;display:none;z-index:40}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 76px}.side{flex-direction:row;overflow:auto;padding:8px}.logo,.sep,.modsw .l{display:none}.modsw{margin:0 0 0 auto;padding:0 8px;white-space:nowrap}.nav{width:auto;white-space:nowrap}.banner{height:auto;flex-direction:column;align-items:flex-start}.banner h1{font-size:40px}.banner .pfp{width:96px;height:96px;font-size:40px}.row{grid-template-columns:24px 1fr 32px 96px 32px;padding:8px 12px}.player{grid-template-columns:1fr 1fr}.player>:last-child{display:none}}
</style></head><body>
<div class="app">
<nav class="side" id="side"></nav>
<section class="main"><div id="main"></div></section>
<div class="player" id="player"></div>
</div>
<div id="cm"></div><div id="ov"></div><div id="toast"></div>
<input type="file" id="pf" accept="image/*" hidden><input type="file" id="bf" accept="image/*" hidden><input type="file" id="ax" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" hidden>
<script>
const DUR=20;
const A=[
{id:"nova",name:"Nova Vale",v:true,bio:"Nova Vale writes late-night synth-pop about city lights and short summers. Her debut “Midnight Static” took over playlists in under a week, and she’s been playing small rooms ever since.",im:["g:210","g:290","g:340"],l:1284503,songs:[["Midnight Static",4821903],["Glass Hours",2210456],["Paper Moons",987221]]},
{id:"kid",name:"Kid Orbit",bio:"Kid Orbit makes bedroom-produced space rock with far too many guitar pedals. Every track was recorded in a garage between shifts.",im:["g:20","g:150"],l:312884,songs:[["Rocket Fuel",1204331],["Lowkey Planet",455820],["Static Kiss",120993]]},
{id:"mara",name:"Mara Lune",bio:"Mara Lune sings quiet folk songs about long drives and window seats. New songs show up whenever she finishes them.",im:["g:160","g:40","g:260"],l:98211,songs:[["Salt & Honey",312044],["Window Seat",88120]]},
{id:"dex",name:"Dex Harlow",bio:"Dex Harlow is just getting started: two demos recorded on a phone, with more on the way.",l:4510,songs:[["First Demo",12044],["Basement Tape",3188]]},
{id:"me",name:"Your Artist",l:0,songs:[]}
];
let uid=0;A.forEach(a=>a.songs=a.songs.map(s=>({id:"s"+uid++,t:s[0],s:s[1]})));
const hue=n=>[...n].reduce((x,c)=>x+c.charCodeAt(0)*13,0)%360;
const col=n=>`hsl(${hue(n)} 55% 38%)`;
const fmt=n=>n.toLocaleString("en-US");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const art=id=>A.find(a=>a.id===id);
const find=id=>{for(const a of A)for(const s of a.songs)if(s.id===id)return[a,s]};
const pfp=a=>`<span class="pfp" style="background:${a.p?`center/cover url(${a.p})`:col(a.name)}">${a.p?"":esc(a.name[0])}</span>`;
const vb=a=>a.v?`<i class="vf" title="Verified artist">✓</i>`:"";
let view={v:"home"},mod=false,cur=null,prog=0,playing=false,counted=false,heard=new Set(),amt=1000;

let tmp=null,tmpA=null,axId=null,dur=DUR,q="";
let epP=null,epB=null,epI=[],sl=0;
function side(){
 const me=art("me"),fl=[...following].map(art);
 const ic=(c,g)=>`<span class="ic" style="background:${g}">${c}</span>`;
 const li=(on,act,id,i,t,s)=>`<button class="nav lb ${on?"on":""}" data-act="${act}"${id?` data-id="${id}"`:""}>${i}<span class="lt"><b>${t}</b><small>${s}</small></span></button>`;
 const cnt=n=>`${n} ${n===1?"song":"songs"}`;
 $("#side").innerHTML=li(view.id==="me","artist","me",pfp(me),esc(me.name)+vb(me),"Your artist page")
 +`<div class="sep"></div><button class="nav ${view.v==="home"?"on":""}" data-act="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg><b>Home</b></button>`
 +`<div class="sq"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" value="${esc(q)}" placeholder="Search songs and artists" autocomplete="off" aria-label="Search songs and artists"></div>`
 +`<div class="sep"></div><div class="lh">Your Library</div><div class="libs">`
 +li(view.v==="liked","liked","",ic("♥","linear-gradient(135deg,#450af5,#c4efd9)"),"Liked Songs",cnt(liked.size))
 +P.map(p=>li(view.id===p.id,"pl",p.id,ic("♪",`linear-gradient(135deg,hsl(${hue(p.name)} 55% 40%),#282828)`),esc(p.name),"Playlist, "+cnt(p.songs.length))).join("")
 +`<button class="nav lb" data-act="newpl"><span class="ic" style="background:#2a2a2a">+</span><span class="lt"><b>New playlist</b></span></button>`
 +fl.map(a=>li(view.id===a.id,"artist",a.id,pfp(a),esc(a.name)+vb(a),"Artist")).join("")
 +(fl.length?"":`<div class="empty" style="padding:12px;font-size:13px">Artists you follow show up here.</div>`)
 +`</div><label class="modsw"><input type="checkbox" id="mod" ${mod?"checked":""}><span><span class="l">Moderator mode</span><span class="l" style="display:block;font-size:11px">Right-click a song to boost</span></span></label>`;
}
let liked=new Set(),following=new Set(),P=[],pendSong=null,delId=null;
const F={nova:52340,kid:8120,mara:2210,dex:140};A.forEach(a=>a.f=F[a.id]||0);
const hb=s=>`<button class="hrt ${liked.has(s.id)?"on":""}" data-act="like" data-id="${s.id}" aria-label="Like song">${liked.has(s.id)?"♥":"♡"}</button>`;
function hearts(){document.querySelectorAll(".hrt").forEach(b=>{const o=liked.has(b.dataset.id);b.classList.toggle("on",o);b.textContent=o?"♥":"♡"})}
const sr=(a,s,i)=>`<div class="row ${cur===s.id?"cur":""}" data-song="${s.id}" data-act="play" data-id="${s.id}"><span class="n">${i+1}</span><span class="t">${cov(s,a)}<span>${esc(s.t)}<small style="display:block;color:var(--mute)">${esc(a.name)}</small></span></span>${hb(s)}<span class="st" data-sid="${s.id}">${fmt(s.s)}</span><button class="more" data-act="more" data-id="${s.id}" aria-label="More">⋯</button></div>`;
const libNav=()=>`<button class="nav ${view.v==="liked"?"on":""}" data-act="liked">♥ Liked Songs</button>${P.map(p=>`<button class="nav ${view.id===p.id?"on":""}" data-act="pl" data-id="${p.id}">♪ ${esc(p.name)}</button>`).join("")}<button class="nav" data-act="newpl">+ New playlist</button><div class="sep"></div>`;
function head(t,n,x){return `<div style="padding:24px"><p style="margin:0;color:var(--mute)">Playlist</p><h1 style="margin:4px 0;font-size:48px;letter-spacing:-1px">${t}</h1><p style="margin:0;color:var(--mute)">${n} ${n===1?"song":"songs"}</p>${x||""}</div>`}
function libView(){const l=[...liked].map(find);return head("Liked Songs",l.length)+(l.length?l.map(([a,s],i)=>sr(a,s,i)).join(""):`<div class="empty">Songs you like show up here. Tap the heart next to any song to add it.</div>`)}
function plView(){const p=P.find(x=>x.id===view.id);if(!p)return "";const l=p.songs.map(find).filter(Boolean);return head(esc(p.name),l.length,`<div style="margin-top:16px"><button class="pill" data-act="delpl" data-id="${p.id}">Delete playlist</button></div>`)+(l.length?l.map(([a,s],i)=>sr(a,s,i)).join(""):`<div class="empty">This playlist is empty. Open ⋯ on any song and choose Add to playlist.</div>`)}
function slBg(x){return x.startsWith("g:")?`linear-gradient(135deg,hsl(${+x.slice(2)} 60% 35%),hsl(${(+x.slice(2)+50)%360} 60% 18%))`:`center/cover url(${x})`}
function thumbs(){return epI.map((x,j)=>`<span class="th" style="background:${slBg(x)}"><button data-act="rmimg" data-j="${j}" aria-label="Remove image">×</button></span>`).join("")}
function about(a){
 const me=a.id==="me",im=a.im||[],n=im.length;
 if(!a.bio&&!n&&!me)return "";
 sl=n?((sl%n)+n)%n:0;
 const tx=a.bio?esc(a.bio):(me&&!n?"Add a bio and photos from the ⋯ menu so listeners can get to know you.":"");
 return `<h2 style="margin-top:32px">About</h2><div class="about">${n?`<div class="sld"><div class="sl" id="slv" style="background:${slBg(im[sl])}"></div>${n>1?`<button class="sn p" data-act="slide" data-d="-1" aria-label="Previous image">‹</button><button class="sn n" data-act="slide" data-d="1" aria-label="Next image">›</button><div class="dots" id="sdt">${im.map((_,j)=>`<i class="${j===sl?"on":""}"></i>`).join("")}</div>`:""}</div>`:""}${tx?`<p class="bio">${tx}</p>`:""}</div>`
}
function results(){
 const k=q.trim().toLowerCase();
 const as=A.filter(a=>a.name.toLowerCase().includes(k)).sort((x,y)=>y.l-x.l);
 const ss=[];A.forEach(a=>a.songs.forEach(s=>{if(s.t.toLowerCase().includes(k))ss.push([a,s])}));
 ss.sort((x,y)=>y[1].s-x[1].s);
 if(!as.length&&!ss.length)return `<div class="empty">No results for “${esc(q.trim())}”. Check the spelling or try a different name.</div>`;
 return (as.length?`<h2>Artists</h2><div class="grid">${as.map(a=>`<button class="card" data-act="artist" data-id="${a.id}">${pfp(a)}<b>${esc(a.name)}${vb(a)}</b><span><span data-aid="${a.id}">${fmt(a.l)}</span> monthly listeners</span></button>`).join("")}</div>`:"")+(ss.length?`<h2>Songs</h2>${ss.map(([a,s],i)=>`<div class="row ${cur===s.id?"cur":""}" data-song="${s.id}" data-act="play" data-id="${s.id}"><span class="n">${i+1}</span><span class="t">${cov(s,a)}<span>${esc(s.t)}<small style="display:block;color:var(--mute)">${esc(a.name)}</small></span></span>${hb(s)}<span class="st" data-sid="${s.id}">${fmt(s.s)}</span><button class="more" data-act="more" data-id="${s.id}" aria-label="More">⋯</button></div>`).join("")}`:"");
}
const au=new Audio();au.onended=()=>{playing=false;prog=0;pl()};
const tf=t=>{t=Math.floor(t||0);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const okAudio=f=>/\.(mp3|wav)$/i.test(f.name)&&(f.type===""||f.type.startsWith("audio/"));
function fit(f,w,h,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const k=Math.max(w/im.width,h/im.height),sw=w/k,sh=h/k;c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);const u=c.toDataURL("image/jpeg",.85);c.toBlob(async b=>cb((b&&await up(b))||u),"image/jpeg",.85)};im.src=r.result};r.readAsDataURL(f)}
function cov(s,a,z){const st=s.c?`background-image:url(${s.c})`:`background:${col(s.t)}`;return `<span class="cov" style="${st}${z?`;width:${z}px;height:${z}px`:""}">${s.c?"":esc(s.t[0])}</span>`}
function loadCover(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=400;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,400,400);tmp=c.toDataURL("image/jpeg",.85);const p=$("#cp");if(p){p.style.backgroundImage=`url(${tmp})`;p.textContent=""}const d0=tmp;c.toBlob(async b=>{const r=b&&await up(b);if(r&&tmp===d0)tmp=r},"image/jpeg",.85);};im.src=r.result};r.readAsDataURL(f)}
function sideOld(){
 $("#side").innerHTML=`<div class="logo">Stream<i>line</i></div>
 <button class="nav ${view.v==="home"?"on":""}" data-act="home">Home</button>
 <button class="nav ${view.id==="me"?"on":""}" data-act="artist" data-id="me">Your artist page</button>
 <div class="sep"></div>
 ${libNav()}${A.filter(a=>a.id!=="me").map(a=>`<button class="nav ${view.id===a.id?"on":""}" data-act="artist" data-id="${a.id}">${pfp(a)}${esc(a.name)}${vb(a)}</button>`).join("")}
 <label class="modsw"><input type="checkbox" id="mod" ${mod?"checked":""}><span><span class="l">Moderator mode</span><span class="l" style="display:block;font-size:11px">Right-click a song to boost</span></span></label>`;
}
function main(){

const OWNER_UID = "SAChTWFrhAW0U16X42h8hTaEdto2";
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), storage=getStorage(app);
const $id=id=>document.getElementById(id), panel=$id("owner-panel"), openBtn=$id("owner-open"), status=$id("owner-status"), logoutBtn=$id("owner-logout"), errorBox=$id("owner-error");
let owner=false, syncTimer=null, syncing=false, lastCloud="";
window.streamlineOwner=false;
function panelOpen(){panel.style.display="grid";errorBox.textContent="";}
function panelClose(){panel.style.display="none";}
function updateModeratorUI(){
 window.streamlineOwner=owner;
 const toggle=$id("mod");
 if(toggle){toggle.disabled=!owner;toggle.checked=owner&&toggle.checked;}
 status.textContent=owner?"Owner signed in":"Public mode";
 openBtn.textContent=owner?"Owner account":"Owner login";
 logoutBtn.style.display=owner?"inline-block":"none";
 if(!owner){const t=$id("mod");if(t)t.checked=false;}
}
openBtn.addEventListener("click",()=>{if(owner){panelOpen();$id("owner-email").value=auth.currentUser?.email||"";return;}panelOpen();});
$id("owner-cancel").addEventListener("click",panelClose);
panel.addEventListener("click",e=>{if(e.target===panel)panelClose();});
$id("owner-form").addEventListener("submit",async e=>{
 e.preventDefault();errorBox.textContent="";
 try{await signInWithEmailAndPassword(auth,$id("owner-email").value.trim(),$id("owner-password").value);$id("owner-password").value="";panelClose();}
 catch(err){errorBox.textContent=err.code==="auth/invalid-credential"?"Email or password is incorrect.":(err.message||"Sign-in failed. Check Firebase Authentication settings.");}
});
logoutBtn.addEventListener("click",async()=>{await signOut(auth);panelClose();});
window.streamlineUploadToStorage=async file=>{
 if(!owner||auth.currentUser?.uid!==OWNER_UID)throw new Error("Owner login required");
 const safeName=(file.name||"upload").replace(/[^a-zA-Z0-9._-]/g,"_");
 const objectRef=ref(storage,`streamline/${Date.now()}_${safeName}`);
 await uploadBytes(objectRef,file,{contentType:file.type||"application/octet-stream"});
 return await getDownloadURL(objectRef);
};
async function loadCloudState(){
 try{
  const refDoc=doc(db,"site","state"),result=await getDoc(refDoc);
  if(result.exists()&&window.streamlineBridge){window.streamlineBridge.applyState(result.data());lastCloud=JSON.stringify(result.data());}
 }catch(err){console.warn("Could not load Streamline cloud state",err);}
}
async function saveCloudState(){
 if(!owner||auth.currentUser?.uid!==OWNER_UID||syncing||!window.streamlineBridge)return;
 const data=window.streamlineBridge.getState(), serialized=JSON.stringify(data);
 if(serialized===lastCloud)return;
 // Firestore documents have a 1 MiB limit; media belongs in Firebase Storage, not in the state document.
 if(serialized.length>850000){status.textContent="Owner signed in · state too large";console.warn("Streamline state is too large for one Firestore document. Upload images/audio to Firebase Storage first.");return;}
 syncing=true;
 try{await setDoc(doc(db,"site","state"),data);lastCloud=serialized;status.textContent="Owner signed in · synced";}
 catch(err){console.warn("Could not save Streamline cloud state",err);status.textContent="Owner signed in · sync error";}
 finally{syncing=false;}
}
onAuthStateChanged(auth,async user=>{
 owner=!!user&&user.uid===OWNER_UID;
 updateModeratorUI();
 if(user&&!owner){await signOut(auth);errorBox.textContent="This account is not authorized as the Streamline owner.";panelOpen();return;}
 if(owner){await loadCloudState();await saveCloudState();if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(saveCloudState,2500);}
 else if(syncTimer){clearInterval(syncTimer);syncTimer=null;}
});
// Public visitors can read the shared public state; only the owner can write under the Firestore rules.
loadCloudState();
